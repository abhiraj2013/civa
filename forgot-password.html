<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Recover access to your CIVA account.">

  <meta name="theme-color" content="#0d6efd">

  <title>CIVA | Forgot Password</title>

  <link rel="stylesheet" href="forgot-password.css">

</head>

<body>

  <main class="forgot-page">

    <section class="forgot-container" aria-labelledby="forgotTitle">


      <a href="home.html" class="forgot-brand" aria-label="CIVA Home">

        <img src="civa.png" alt="CIVA" class="forgot-brand-logo">

        <span>CIVA</span>

      </a>


      <div class="forgot-card">


        <a href="login.html" class="back-login">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <path d="m15 18-6-6 6-6"></path>

          </svg>

          <span>
            Back to Sign In
          </span>

        </a>


        <div class="forgot-icon" aria-hidden="true">

          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">

            <rect x="3" y="5" width="18" height="14" rx="2">
            </rect>

            <path d="m3 7 9 6 9-6">
            </path>

          </svg>

        </div>


        <div class="forgot-heading">

          <p class="forgot-label">
            Account recovery
          </p>

          <h1 id="forgotTitle">
            Forgot your password?
          </h1>

          <p class="forgot-description">
            Enter the email address connected
            to your CIVA account.
          </p>

        </div>


        <form id="forgotPasswordForm" class="forgot-form" novalidate>


          <div class="forgot-field">

            <label for="email">
              Email address
            </label>

            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
              inputmode="email" maxlength="254" required aria-describedby="emailError">

            <small id="emailError" class="forgot-error">
            </small>

          </div>


          <button type="submit" id="resetSubmit" class="reset-submit">

            Continue

          </button>


          <div id="resetMessage" class="reset-message" role="status" aria-live="polite">
          </div>

        </form>


        <div class="forgot-security-note">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <rect x="5" y="10" width="14" height="10" rx="2">
            </rect>

            <path d="M8 10V7a4 4 0 0 1 8 0v3">
            </path>

          </svg>

          <p>
            Never share your password or
            verification information with anyone.
          </p>

        </div>


      </div>


      <p class="forgot-footer">
        Need help?
        <a href="contact.html">
          Contact CIVA
        </a>
      </p>


    </section>

  </main>


  <script src="forgot-password.js"></script>

</body>

</html>
