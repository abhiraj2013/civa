<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#1565c0">

  <meta name="description" content="Publish news on CIVA.">

  <title>
    CIVA | Publish News
  </title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="responsive.css">

  <style>
    .create-news-page {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    .create-news-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .create-news-back {
      text-decoration: none;
      font-size: 24px;
    }

    .create-news-title {
      margin: 0;
    }

    .news-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .news-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .news-field label {
      font-weight: 600;
    }

    .news-field input,
    .news-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #d5dce5;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .news-field input:focus,
    .news-field textarea:focus {
      border-color: #1565c0;
    }

    .news-field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .news-image-preview {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 12px;
      display: none;
      background: #f5f7fa;
    }

    .publish-news-submit {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #1565c0;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .publish-news-submit:active {
      transform: scale(.98);
    }
  </style>

</head>


<body>

  <main class="create-news-page">


    <!-- HEADER -->

    <header class="create-news-header">

      <a href="news.html" class="create-news-back" aria-label="Back to News">

        ←

      </a>

      <h1 class="create-news-title">
        Publish Your News
      </h1>

    </header>


    <!-- FORM -->

    <form id="createNewsForm" class="news-form">


      <!-- TITLE -->

      <div class="news-field">

        <label for="newsTitle">
          News Title
        </label>

        <input type="text" id="newsTitle" name="title" placeholder="Enter your news title" maxlength="150" required>

      </div>


      <!-- CONTENT -->

      <div class="news-field">

        <label for="newsContent">
          News
        </label>

        <textarea id="newsContent" name="content" placeholder="Write your news here..." maxlength="5000" required>
        </textarea>

      </div>


      <!-- IMAGE -->

      <div class="news-field">

        <label for="newsImage">
          News Image
        </label>

        <input type="file" id="newsImage" name="image" accept="image/*">

      </div>


      <img id="newsImagePreview" class="news-image-preview" alt="News image preview">


      <!-- SUBMIT -->

      <button type="submit" class="publish-news-submit">

        Publish News

      </button>


    </form>

  </main>


  <script src="create-news.js"></script>

</body>

</html>
