<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#1565c0">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="description"
        content="CIVA is a simple platform for sharing public problems, discovering civic discussions, supporting useful posts, and participating peacefully in communities.">

    <meta
        name="keywords"
        content="CIVA, public problems, civic issues, civic participation, public discussions, communities, social issues">

    <meta
        name="author"
        content="CIVA">

    <meta
        name="application-name"
        content="CIVA">

    <meta
        name="robots"
        content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <meta
        name="referrer"
        content="strict-origin-when-cross-origin">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:title"
        content="CIVA | Public Problems & Civic Participation">

    <meta
        property="og:description"
        content="Share public problems, discover useful discussions, support posts and explore civic communities with CIVA.">

    <meta
        property="og:image"
        content="civa.png">

    <meta
        property="og:image:alt"
        content="CIVA logo">

    <meta
        property="og:site_name"
        content="CIVA">

    <meta
        name="twitter:card"
        content="summary">

    <meta
        name="twitter:title"
        content="CIVA | Public Problems & Civic Participation">

    <meta
        name="twitter:description"
        content="A simple platform for public problems, civic discussions and peaceful civic participation.">

    <meta
        name="twitter:image"
        content="civa.png">

    <meta
        name="twitter:image:alt"
        content="CIVA logo">

    <link
        rel="icon"
        type="image/png"
        href="civa.png">

    <link
        rel="apple-touch-icon"
        href="civa.png">

    <link
        rel="preload"
        as="image"
        href="civa.png">

    <title>CIVA | Public Problems & Civic Participation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #ffffff;

            color: #1565c0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .welcome {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));
        }

        .welcome-content {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome-logo {
            width: min(190px, 58vw);
            height: auto;

            display: block;

            object-fit: contain;

            opacity: 0;

            transform: scale(0.92);

            animation:
                civa-logo-in 0.55s ease-out forwards;
        }

        .welcome-text {
            margin: 13px 0 0;

            color: #667085;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.08em;

            opacity: 0;

            animation:
                civa-text-in 0.45s ease-out 0.3s forwards;
        }

        @keyframes civa-logo-in {

            0% {
                opacity: 0;
                transform: scale(0.92);
            }

            70% {
                opacity: 1;
                transform: scale(1.03);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes civa-text-in {

            0% {
                opacity: 0;
                transform: translateY(5px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {

            .welcome-logo {
                width: min(170px, 56vw);
            }

            .welcome-text {
                font-size: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .welcome-logo,
            .welcome-text {
                animation: none;

                opacity: 1;

                transform: none;
            }
        }
    </style>
</head>

<body>

    <main
        class="welcome"
        aria-label="CIVA">

        <div class="welcome-content">

            <img
                src="civa.png"
                alt="CIVA"
                class="welcome-logo"
                width="190"
                height="64"
                fetchpriority="high">

            <p class="welcome-text">
                Welcome To CIVA 
            </p>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
